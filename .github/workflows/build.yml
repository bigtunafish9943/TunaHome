name: TunaHome

on:
  push:
    # Text-only changes don't need a new APK or release
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:

permissions:
  contents: write

# One build per branch at a time; a newer push waits rather than racing the release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.ks.outputs.present }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The whole history and tags, so release notes can list every change since the last release
          fetch-depth: 0

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK; install only what this app builds against.
      - name: SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Release secrets present
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASSWORD}" ] && [ -n "${KEY_ALIAS}" ] && [ -n "${KEY_PASSWORD}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are absent. This APK is a sideload test only. It will not upgrade in place to a real release. No GitHub Release." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASSWORD}" ] && [ -n "${KEY_ALIAS}" ] && [ -n "${KEY_PASSWORD}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tunahome.keystore"
            export KEYSTORE_FILE="$RUNNER_TEMP/tunahome.keystore"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/tunahome-ci.keystore" \
              -storepass android -alias tunahome -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=TunaHome CI, O=TunaHome, C=US"
            export KEYSTORE_FILE="$RUNNER_TEMP/tunahome-ci.keystore"
            export KEYSTORE_PASSWORD=android
            export KEY_ALIAS=tunahome
            export KEY_PASSWORD=android
          fi
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace \
            -PtunaVersionName=0.1.${{ github.run_number }} \
            -PtunaVersionCode=${{ github.run_number }}

      # One APK for every device: TunaHome has no processor-specific code
      - name: Name the APK
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/TunaHome-0.1.${{ github.run_number }}.apk"
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TunaHome-apk
          path: out/*.apk
          if-no-files-found: error

  # Runs the new APK on an Android TV emulator: screenshots of the main screens, and a check that
  # TunaHome didn't stop with an error. A release only goes out if this passes.
  tv-check:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get the APK
        uses: actions/download-artifact@v4
        with:
          name: TunaHome-apk
          path: out

      # The emulator needs the processor's virtualisation, which GitHub's Linux runners have
      - name: Allow the emulator to use virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: .github/scripts/check-on-tv.sh "$(ls out/*.apk | head -1)" tv-check

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-check
          path: tv-check
          if-no-files-found: ignore
          retention-days: 30

  release:
    needs: [apk, tv-check]
    if: needs.apk.outputs.signed == 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The whole history and tags, so release notes can list every change since the last release
          fetch-depth: 0

      - name: Get the APK
        uses: actions/download-artifact@v4
        with:
          name: TunaHome-apk
          path: out

      # gh instead of a release action: GitHub sometimes answers 500 when a release is
      # created, so try a few times before giving up
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag="v0.1.${{ github.run_number }}"
          # Release notes: every change since the last release, as written in its description.
          # TunaHome shows these as "What's new" after it updates.
          prev=$(git describe --tags --abbrev=0 --match 'v0.1.*' HEAD 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          [ -z "$prev" ] && range="-1"
          git log $range --no-merges --format='### %s%n%n%b%n' \
            | grep -v -E '^(Co-Authored-By|Claude-Session|Signed-off-by):' \
            | cat -s > notes.md
          [ -s notes.md ] || echo "Small fixes and improvements." > notes.md
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" > /dev/null 2>&1; then
              gh release upload "$tag" out/*.apk --clobber && exit 0
            elif gh release create "$tag" out/*.apk \
                --title "TunaHome 0.1.${{ github.run_number }}" \
                --target "$GITHUB_SHA" --notes-file notes.md; then
              exit 0
            fi
            echo "Attempt $attempt failed; trying again shortly"
            sleep $((attempt * 15))
          done
          echo "Couldn't publish the release" >&2
          exit 1
