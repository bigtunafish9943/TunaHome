apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.tunastream.home'
    compileSdk = 36

    defaultConfig {
        applicationId "com.tunastream.home"
        minSdk 23
        targetSdk 34

        // CI passes -PtunaVersionName and -PtunaVersionCode
        versionName = (project.findProperty("tunaVersionName") ?: "0.1.0").toString()
        versionCode = Integer.parseInt((project.findProperty("tunaVersionCode") ?: "1").toString())
    }

    buildFeatures {
        buildConfig = true
    }

    // Fonts ship uncompressed so they can be read straight from the APK
    androidResources {
        noCompress += ['ttf', 'otf']
    }

    // The key never lives in the repo: CI writes it to a temporary file from the repo's secrets
    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
            // Leave out unused code and pictures: a smaller download that starts faster
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation project(':projectivyapi')
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    // Video backgrounds
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
    // The QR code on "Set up from your phone"
    implementation 'com.google.zxing:core:3.5.3'
    // Installs the start-up profile on the TV, so TunaHome's code is compiled ahead of time
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    implementation 'androidx.media3:media3-ui:1.8.0'
}
