// Top-level build file. GitHub Actions is the compile step; see .github/workflows/build.yml
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
